name: doctor

# Manual only. Run this after adding the secrets and before enabling the cron.
# The live check loads one Alaska results page per route per probe, so 6 page
# loads at the defaults (2 routes x 3 probes).

on:
  workflow_dispatch:
    inputs:
      probes:
        description: "Live probes per route"
        type: string
        default: "3"
      skip_live:
        description: "Config, browser and email only, no page loads"
        type: boolean
        default: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The live check drives a headless browser, so Chromium must be present.
      # pip installs the playwright package but not the browser binary.
      - name: Install Chromium for the Alaska scraper
        run: python -m playwright install --with-deps chromium

      - name: Preflight
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          # Via env + quoting, never interpolated into the shell, so a crafted
          # dispatch value cannot inject commands (skip_live is a safe literal).
          PROBES: ${{ inputs.probes || 3 }}
        run: |
          python -m src.doctor \
            --probes "$PROBES" \
            ${{ inputs.skip_live && '--skip-live' || '' }}
