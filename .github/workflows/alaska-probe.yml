# Cloud-IP GO/NO-GO for the Alaska scraper.
#
# The scanner runs on GitHub's shared datacenter IPs. Alaska served real fares
# to a headless browser from a residential IP during the spike, but F5/Shape
# bot detection is present and is far more likely to challenge a datacenter IP.
# This job answers the one question that decides the whole migration: does a
# headless Chromium on a GitHub runner still get fares?
#
# It is manual (workflow_dispatch) plus a weekly canary, so a later silent
# block shows up as a red run instead of empty scans. No secrets needed.
name: alaska-probe

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Origin IATA
        default: SEA
      destination:
        description: Destination IATA
        default: SFO
  # Run the probe automatically whenever the scraper itself changes, on any
  # branch. That is what lets a push double as the cloud-IP go/no-go.
  push:
    paths:
      - "src/alaska.py"
      - ".github/workflows/alaska-probe.yml"
      - "spikes/alaska/**"
  schedule:
    - cron: "17 15 * * 1"   # Mondays, canary

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Price a near-future date (35 days out)
        env:
          O: ${{ github.event.inputs.origin || 'SEA' }}
          D: ${{ github.event.inputs.destination || 'SFO' }}
        run: |
          DEPART=$(date -u -d "+35 days" +%F)
          echo "Probing $O-$D on $DEPART from $(curl -s https://api.ipify.org || echo unknown)"
          python -m src.alaska --from "$O" --to "$D" --depart "$DEPART" -v
