name: fare scan

on:
  schedule:
    # Two fixed UTC times ~12h apart. An earlier design used four crons plus a
    # gate that checked the current Pacific hour, but GitHub delays scheduled
    # runs unpredictably (often 30-120 min), so the wall-clock hour was usually
    # wrong and the gate skipped nearly every run. Fixed UTC is immune: the
    # local time drifts one hour across DST, which is irrelevant for a twice-
    # daily fare check.
    - cron: "10 13 * * *"   # ~06:10 Pacific (05:10 PST / 06:10 PDT)
    - cron: "10 01 * * *"   # ~18:10 Pacific (17:10 PST / 18:10 PDT)
  workflow_dispatch:
    inputs:
      sweep:
        description: "Force a full sweep"
        type: boolean
        default: false
      dry_run:
        description: "Price everything, send and write nothing"
        type: boolean
        default: false

concurrency:
  group: fare-scan
  cancel-in-progress: false

# Least privilege by default; only the scan job needs write, and publish
# declares its own Pages-scoped block below.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job commits data/ back to the repo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The Alaska fare source drives a headless browser, so the Chromium
      # binary must be present. pip installs the playwright package but not the
      # browser; without this the daily scan fails at the first fare lookup.
      - name: Install Chromium for the Alaska scraper
        run: python -m playwright install --with-deps chromium

      - name: Scan
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          REPORT_URL: ${{ vars.REPORT_URL }}
        run: |
          python -m src.scan \
            ${{ inputs.sweep && '--sweep' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit price history and report
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "fare-scan"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet && { echo "no data changes to commit"; exit 0; }
          git commit -m "prices $(date -u +%Y-%m-%d)"
          # main can advance between checkout and push (a dependabot merge lands
          # often). data/ is append-only per run, so a rebase is conflict-free;
          # retry a few times rather than fail after the scrape already ran.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt); rebasing on origin/main"
            git pull --rebase --autostash origin main
          done
          git push

  publish:
    needs: scan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # Check out main rather than the triggering SHA: the scan job has
      # already pushed today's observations and the report needs them.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build report
        run: python -m src.report --out site/index.html --days 60

      # enablement: true was tried and does not work: GITHUB_TOKEN cannot
      # create a Pages site ("Resource not accessible by integration"). Pages
      # has to be switched on once by hand, under Settings > Pages, with the
      # source set to GitHub Actions. After that this step is a no-op.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
