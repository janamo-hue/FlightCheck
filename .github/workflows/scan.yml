name: fare scan

on:
  schedule:
    # GitHub cron is UTC only, so holding 06:00 and 18:00 Pacific year round
    # takes four entries and a gate. Two fire in daylight time, two in
    # standard time; the gate drops whichever pair is currently an hour off.
    # Scheduling at :10 past means the usual Actions queueing delay cannot
    # push a run into the next local hour and get it discarded.
    - cron: "10 13 * * *"   # 06:10 PDT
    - cron: "10 14 * * *"   # 06:10 PST
    - cron: "10 01 * * *"   # 18:10 PDT
    - cron: "10 02 * * *"   # 18:10 PST
  workflow_dispatch:
    inputs:
      sweep:
        description: "Force a full sweep"
        type: boolean
        default: false
      dry_run:
        description: "Price everything, send and write nothing"
        type: boolean
        default: false

concurrency:
  group: fare-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Half the scheduled triggers are an hour off in the current DST offset.
  # Deciding here rather than mid-job means those show up as skipped rather
  # than as a failure or, worse, a silent extra scrape.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch, running"
            exit 0
          fi
          hour=$(TZ=America/Los_Angeles date +%H)
          if [ "$hour" = "06" ] || [ "$hour" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Pacific hour $hour -> run=$(cat "$GITHUB_OUTPUT" | tail -1)"

  scan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The Alaska fare source drives a headless browser, so the Chromium
      # binary must be present. pip installs the playwright package but not the
      # browser; without this the daily scan fails at the first fare lookup.
      - name: Install Chromium for the Alaska scraper
        run: python -m playwright install --with-deps chromium

      - name: Scan
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          REPORT_URL: ${{ vars.REPORT_URL }}
        run: |
          python -m src.scan \
            ${{ inputs.sweep && '--sweep' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit price history and report
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "fare-scan"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "prices $(date -u +%Y-%m-%d)"
          git push

  publish:
    needs: scan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # Check out main rather than the triggering SHA: the scan job has
      # already pushed today's observations and the report needs them.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build report
        run: python -m src.report --out site/index.html --days 60

      # enablement: true was tried and does not work: GITHUB_TOKEN cannot
      # create a Pages site ("Resource not accessible by integration"). Pages
      # has to be switched on once by hand, under Settings > Pages, with the
      # source set to GitHub Actions. After that this step is a no-op.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
