name: fare scan

on:
  schedule:
    # 14:10 UTC = 07:10 Pacific daylight, 06:10 Pacific standard.
    - cron: "10 14 * * *"
  workflow_dispatch:
    inputs:
      sweep:
        description: "Force a full sweep"
        type: boolean
        default: false
      dry_run:
        description: "Price everything, send and write nothing"
        type: boolean
        default: false

concurrency:
  group: fare-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan
        env:
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          AMADEUS_ENV: ${{ vars.AMADEUS_ENV || 'production' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          REPORT_URL: ${{ vars.REPORT_URL }}
        run: |
          python -m src.scan \
            ${{ inputs.sweep && '--sweep' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit price history and report
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "fare-scan"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "prices $(date -u +%Y-%m-%d)"
          git push

  publish:
    needs: scan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # Check out main rather than the triggering SHA: the scan job has
      # already pushed today's observations and the report needs them.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build report
        run: python -m src.report --out site/index.html --days 60

      # enablement: true was tried and does not work: GITHUB_TOKEN cannot
      # create a Pages site ("Resource not accessible by integration"). Pages
      # has to be switched on once by hand, under Settings > Pages, with the
      # source set to GitHub Actions. After that this step is a no-op.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
