# Alaska direct-flight price watch configuration.
#
# Fares are read by loading alaskaair.com results pages with a headless browser,
# so there is no paid quota. The ceilings below are self-imposed page-load
# limits to stay unobtrusive. Run `python -m src.budget` for projected usage.

defaults:
  adults: 1
  currency: USD
  cabin: ECONOMY
  carrier: AS              # Alaska Airlines
  nonstop: true
  exclude_saver: true      # Saver earns zero Atmos points, so skip it
  max_offers: 20           # offers to pull per call, so a non-Saver exists

  # Search window, in days from the run date.
  window_start_days: 14
  window_end_days: 180

  # Deep sweep: sample every Nth day across the window, on sweep_weekday only.
  sweep_stride_days: 4
  sweep_weekday: 6         # 0=Mon ... 6=Sun
  # Optional: restrict sampled departures to these weekdays. Empty = all.
  depart_weekdays: []

  # Daily watchlist: re-check the K cheapest date pairs found in the last sweep.
  watchlist_size: 8

  # Round-trip lengths to price. Set one_way: true to ignore.
  trip_lengths: [7]
  one_way: false

  # Alerting
  drop_pct: 15             # alert when price falls this % below baseline
  baseline_days: 14        # trailing window for the median baseline
  min_observations: 3      # need this much history before percent alerts fire
  alert_on_all_time_low: true
  all_time_low_margin_pct: 3    # ignore new lows shallower than this
  atl_days: 90                  # horizon for 'all-time' low, keeps it comparable
  debounce_hours: 48       # suppress repeat alerts for the same date pair
  realert_pct: 5           # unless it drops a further this % below last alert

  # Absolute price targets: alert when a fare is at or below this number,
  # regardless of what it cost yesterday. These fire on the first sighting of
  # a date pair and ignore min_observations, so they reach the ~75% of tracked
  # pairs that never accumulate enough history to arm drop_pct or the
  # all-time-low trigger.
  #
  # Set per route below, not here: a sensible target is a property of the
  # route, not a default. Run `python -m src.targets --sweep` to see what a
  # candidate value would have caught against stored history.

  # Points, for the redeem-or-pay call. See README for where the floor
  # numbers come from. Unset award_floor_points to switch this off.
  point_value_cents: 1.5   # what you reckon an Atmos point is worth
  redeem_above_cents: 2.0  # flag a redemption when the fare beats this
  spike_pct: 25            # also alert when the fare rises this % above baseline

# Hard ceiling on page loads per run. Sweeps resume next run if truncated.
daily_call_budget: 120

# Scheduled runs per day. The workflow fires at 06:10 and 18:10 Pacific; this
# only needs to match so the projection from `python -m src.budget` is honest.
runs_per_day: 2

# Self-imposed monthly page-load ceiling. The scanner stops at reserve_pct of
# this so a busy month cannot run away with requests against alaskaair.com.
monthly_call_quota: 2000
quota_reserve_pct: 95

routes:


  - name: Seattle to Albuquerque
    origin: SEA
    destination: ABQ
    distance_miles: 1179
    award_floor_points: 7500     # 1,179 mi, inside the <=1,400 band
    # Floors observed over 220 samples (2026-08): MAIN 397, SAVER 297, and
    # nothing has ever priced below either. Targets sit ~5% under, so they stay
    # silent until a fare appears that is genuinely new, rather than firing on
    # the floor the route sits at 60% of the time.
    target_price: 377
    saver_target_price: 282
    near_stride_days: 4          # every 4th day out to near_days (60)
    sweep_stride_days: 12        # every 12th beyond; multiple of 4, so dates
    watchlist_size: 8            # stay on the grid crossing the boundary

  - name: Seattle to New Orleans
    origin: SEA
    destination: MSY
    distance_miles: 2083
    award_floor_points: 10000    # 2,083 mi, 18 mi under the 2,101 boundary.
                                 # BAND UNVERIFIED: this is a guess for the
                                 # 1,401-2,100 band. Confirm on the chart.
    # Floors observed over 216 samples (2026-08): MAIN 487, SAVER 377. Same
    # ~5%-under rule as ABQ.
    target_price: 463
    saver_target_price: 358
    near_stride_days: 4
    sweep_stride_days: 12
    watchlist_size: 8
